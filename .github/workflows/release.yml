name: Build & Release

# 触发方式：
#   1) src/ scripts/ requirements.txt 有推送 —— 自动把补丁版本号 +1 并发布
#   2) 手动触发（Actions 页面的 Run workflow）—— 可选 patch / minor / major
#
# 版本号来源：仓库现有的 v* 标签。计算出的新版本号会写入 src/version.py 后再构建，
# 因此程序界面标题与底部会显示当次版本。

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: "版本递增类型"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 检出代码（含标签历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          # 与 requirements.txt 锁定版本对应（numpy 2.5.x 需要 3.12+）
          python-version: "3.13"

      - name: 计算下一个版本号
        id: ver
        shell: pwsh
        run: |
          $bump = "${{ github.event.inputs.bump }}"
          if ([string]::IsNullOrWhiteSpace($bump)) { $bump = "patch" }
          $versions = git tag -l "v*" |
            ForEach-Object { $_ -replace "^v", "" } |
            Where-Object { $_ -match "^\d+\.\d+\.\d+$" } |
            ForEach-Object { [version]$_ } |
            Sort-Object
          $latest = if ($versions) { $versions[-1] } else { [version]"1.0.0" }
          if ($bump -eq "major") {
            $next = "{0}.0.0" -f ($latest.Major + 1)
          } elseif ($bump -eq "minor") {
            $next = "{0}.{1}.0" -f $latest.Major, ($latest.Minor + 1)
          } else {
            $next = "{0}.{1}.{2}" -f $latest.Major, $latest.Minor, ($latest.Build + 1)
          }
          Write-Host "上一个版本: v$latest  ->  本次版本: v$next  (递增类型: $bump)"
          "version=$next" >> $env:GITHUB_OUTPUT

      - name: 写入版本号到源码
        shell: pwsh
        run: |
          # 直接替换 app.py 内的 APP_VERSION 常量：不依赖独立模块，
          # 避免 PyInstaller 打包时模块收集遗漏导致运行期 ModuleNotFoundError
          $v = "${{ steps.ver.outputs.version }}"
          $path = "src\app.py"
          $content = Get-Content $path -Raw -Encoding utf8
          # 兼容单/双引号两种写法（重建版源码使用单引号风格）
          $content = $content -replace 'APP_VERSION = "[^"]*"', ('APP_VERSION = "' + $v + '"')
          $content = $content -replace "APP_VERSION = '[^']*'", ("APP_VERSION = '" + $v + "'")
          [System.IO.File]::WriteAllText((Resolve-Path $path).Path, $content, (New-Object System.Text.UTF8Encoding($false)))
          if ($content -notmatch ('APP_VERSION = .{0,1}' + [regex]::Escape($v))) {
            throw "版本号注入失败：src\app.py 中未找到 APP_VERSION 常量"
          }
          Select-String -Path $path -Pattern 'APP_VERSION =' | ForEach-Object { "  已写入: " + $_.Line.Trim() }

      - name: 建立虚拟环境并安装依赖
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: 构建单文件 exe
        shell: pwsh
        run: ./scripts/build.ps1 *> build-log.txt; if (-not $?) { exit 1 }

      - name: 构建失败时输出日志诊断（注解 + 完整日志 artifact）
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build-log.txt) {
            $errs = Select-String -Path build-log.txt -Pattern '::error::|ERROR:|Traceback|Exception|throw' | Select-Object -First 12
            foreach ($e in $errs) { "::error::" + $e.Line.Trim() }
            $tail = Get-Content build-log.txt -Tail 30
            "::error::---- build-log.txt 最后 30 行 ----"
            foreach ($l in $tail) { "::error::$l" }
          } else {
            "::error::未找到 build-log.txt"
          }

      - name: 上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          retention-days: 3

      - name: 生成发布说明
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $commits = git log --pretty=format:"- %s" -12
          $header = @(
            "## GUIT-net-login v$v",
            "",
            "校园网网页认证（Portal）快捷登录工具 —— 双击打开「联网设置」窗口，填好账号点一下「连接」即可上网。",
            "",
            "### 下载",
            "",
            "| 文件 | 体积 | 说明 |",
            "| --- | --- | --- |",
            "| ``GUIT-net-login.exe`` | 约 45 MB | 单文件，双击即用，验证码自动识别 |",
            "",
            "单文件 exe，双击即用，不需要安装 Python。",
            "",
            "### 本次变更",
            ""
          )
          $footer = @(
            "",
            "### 说明",
            "",
            "程序不写日志；只有勾选「记住密码」或「开机自动登录」时才会在 exe 同目录生成 config.json，取消勾选会自动删除。",
            "",
            "本工具仅为便利性网络连接工具，不修改、不破解、不绕过任何认证与计费机制；账号密码只保存在本机。仅限个人账号使用。"
          )
          ($header + $commits + $footer) | Set-Content -Path RELEASE_NOTES.md -Encoding utf8

      - name: 创建标签并发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "v$v"
          git tag $tag
          git push origin $tag
          gh release create $tag `
            --title "GUIT-net-login $tag" `
            --notes-file RELEASE_NOTES.md `
            build/GUIT-net-login.exe
          Write-Host "已发布 $tag"
